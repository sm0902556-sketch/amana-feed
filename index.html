<script>
/* ===================== البيانات ===================== */
const KEY='amana_mill_db_v1';
const DEV={name:'المبرمج محمد سعيد',phone:'01123840671'};
let db;
function defaultDB(){
  const it=(code,name,unit,buy,sell,openQty,service)=>({id:uid(),code,name,unit,buy,sell,openQty,min:service?0:10,service:!!service});
  return {
    settings:{name:'مصنع الأمانة',sub:'للأعلاف',owner:'الحاج راضي',phone:'01116729088',mgr:'الحاج راضي / 01116729088\nأ. محمد نصر / 01140347001',tax:'س.ت / 45766\nب.ض / 340/353/287',address:'',footer:'شكراً لتعاملكم معنا'},
    items:[
      it('1002','ذرة صفراء','كجم',15,16.5,0),
      it('1003','صويا','كجم',26,28,0),
      it('1004','نخالة','كجم',14.75,15.8,0),
      it('1005','مستخلص','كجم',20,22,0),
      it('1006','مصنّع','كجم',0,0,0),
      it('1007','سموم','عبوة',0,60,0),
      it('1008','كربونات','كجم',0,0,0),
      it('1009','ثوم','عبوة',0,0,0),
      it('1010','خميرة إسلامي','عبوة',0,0,0),
      it('1011','أملاح بريمكس','عبوة',0,175,0),
      it('1012','ملح طعام','كجم',2,2.5,0),
      it('1013','خميرة','عبوة',0,180,0),
      it('1014','عمالة','خدمة',0,75,0,true),
      it('1015','مدشة','خدمة',0,75,0,true),
      it('1016','نقل','خدمة',0,0,0,true),
      it('1017','كسر صويا','كجم',0,0,0),
      it('1018','رجيعة كون','كجم',0,0,0),
      it('1019','علف حاضر','كجم',0,0,0),
      it('1026','رافع مناعة','عبوة',0,500,0),
      it('1029','بقر','عبوة',0,60,0)
    ],
    parties:[], invoices:[], cash:[], log:[], seq:{sale:0,purchase:0}
  };
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{const s=localStorage.getItem(KEY);db=s?JSON.parse(s):defaultDB()}catch(e){db=defaultDB()}
  db.seq=db.seq||{sale:0,purchase:0};if(db.settings.name==='مدشة الأمانة'){db.settings.name='مصنع الأمانة';db.settings.sub='للأعلاف'}db.log=db.log||[];db.log.forEach(l=>{if(!l.id)l.id='L'+uid()});db.parties.forEach((p,k)=>{if(!p.code)p.code=String(1001+k)});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ تعذر الحفظ على الجهاز')}if(typeof scheduleSync==='function')scheduleSync()}
function log(msg){db.log.unshift({id:uid(),d:new Date().toISOString(),m:msg});if(db.log.length>500)db.log.length=500}
load();

/* ===================== أدوات ===================== */
const $=s=>document.querySelector(s);
const n2=v=>Math.round((+v||0)*100)/100;
const fm=v=>n2(v).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const item=id=>db.items.find(x=>x.id===id);
const party=id=>db.parties.find(x=>x.id===id);

/* تفقيط بالعربي */
function tafqeet(num){
  num=n2(num);let g=Math.floor(num),q=Math.round((num-g)*100);
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const u1000=n=>{const p=[];const h=Math.floor(n/100),r=n%100;if(h)p.push(hund[h]);
    if(r){if(r<20)p.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ones[o]+' و'+tens[t]:tens[t])}}return p.join(' و')};
  const scale=(n,one,two,plural)=>n===1?one:n===2?two:(n<=10?u1000(n)+' '+plural:u1000(n)+' '+one);
  if(g===0&&q===0)return 'صفر';
  const parts=[];const m=Math.floor(g/1e6),t=Math.floor((g%1e6)/1000),r=g%1000;
  if(m)parts.push(scale(m,'مليون','مليونان','ملايين'));
  if(t)parts.push(scale(t,'ألف','ألفان','آلاف'));
  if(r)parts.push(u1000(r));
  let s=parts.length?parts.join(' و')+' جنيهاً':'';
  if(q)s+=(s?' و':'')+u1000(q)+' قرشاً';
  return s+' فقط لا غير';
}

/* ===================== الحسابات ===================== */
function stockOf(it){
  if(it.service)return null;
  let q=+it.openQty||0;
  for(const inv of db.invoices)for(const l of inv.lines)if(l.itemId===it.id)q+=inv.type==='purchase'?+l.qty:-l.qty;
  return n2(q);
}
function invTotal(inv){const s=inv.lines.reduce((a,l)=>a+(l.qty*(l.price-(+l.disc||0))),0);return n2(s-(+inv.discount||0))}
function partyBalance(p){
  let b=+p.opening||0;
  for(const inv of db.invoices)if(inv.partyId===p.id)b+=invTotal(inv)-(+inv.paid||0);
  for(const c of db.cash)if(c.partyId===p.id)b-=(+c.amount||0);
  return n2(b);
}
function cashBalance(){
  let b=0;
  for(const inv of db.invoices)b+=inv.type==='sale'?+inv.paid||0:-(+inv.paid||0);
  for(const c of db.cash)b+=c.dir==='in'?+c.amount:-c.amount;
  return n2(b);
}
function invProfit(inv){return n2(inv.lines.reduce((a,l)=>{const it=item(l.itemId);const cost=it?+it.buy||0:0;return a+l.qty*(l.price-(+l.disc||0)-cost)},0)-(+inv.discount||0))}

/* ===================== التنقل ===================== */
const pages={home,sale:()=>invoiceForm('sale'),purchase:()=>invoiceForm('purchase'),items,parties,more,invoices,cash,reports,settings,party:partyPage,edit:editInvoice,log:logPage};
function route(){
  const [p,arg]=location.hash.slice(1).split('/');const f=pages[p]||home;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===(p||'home')||(a.dataset.p==='more'&&['purchase','invoices','cash','reports','settings','log'].includes(p))));
  $('#hName').textContent=db.settings.name||'مصنع الأمانة';
  $('#hSub').textContent=db.settings.sub||'للأعلاف';
  $('#app').innerHTML='';f(arg);window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
const footer=()=>`<div class="foot">إصدار ${typeof APP_VERSION!=='undefined'?APP_VERSION:''} — برمجة ${DEV.name} — واتساب <a href="https://wa.me/2${DEV.phone}">${DEV.phone}</a></div>`;

/* ===================== الرئيسية ===================== */
function home(){
  const t=today();
  const todays=db.invoices.filter(i=>i.type==='sale'&&i.date===t);
  const sales=todays.reduce((a,i)=>a+invTotal(i),0);
  const profit=todays.reduce((a,i)=>a+invProfit(i),0);
  const debts=db.parties.filter(p=>p.type==='customer').reduce((a,p)=>a+Math.max(0,partyBalance(p)),0);
  const low=db.items.filter(i=>!i.service&&stockOf(i)<=(+i.min||0));
  const dueToday=db.invoices.filter(i=>i.type==='sale'&&i.due&&i.due<=t&&invTotal(i)-(+i.paid||0)>0&&party(i.partyId)&&partyBalance(party(i.partyId))>0);
  const T=(h,i,t,c)=>`<a class="tile" href="#${h}"><i style="background:${c}22;color:${c}">${i}</i>${t}</a>`;
  $('#app').innerHTML=`
  <img class="banner" src="${db.settings.banner||BANNER}" alt="${esc(db.settings.name)}">

function invoiceForm(type){cur=newInv(type);drawInv()}

  const q=($('#srch')?.value||'').trim();

  $('#chips').innerHTML=list.map(i=>`<span class="chip" onclick="addLine('${i.id}')">${esc(i.name)} <small>${i.code} · ${fm(cur.type==='sale'?i.sell:i.buy)}ج${i.service?'':' · متاح '+fm(stockOf(i))}</small></span>`).join('')||'<span class="muted">مفيش صنف بالاسم ده — ضيفه من صفحة الأصناف</span>';

function addByCode(){const q=$('#srch').value.trim();const i=db.items.find(x=>x.code===q)||db.items.find(x=>x.name===q);if(i)addLine(i.id)}
function addLine(id){
  const it=item(id);const ex=cur.lines.find(l=>l.itemId===id);
  if(ex)ex.qty=n2(+ex.qty+1);else cur.lines.push({itemId:id,code:it.code,name:it.name,unit:it.unit,qty:1,price:cur.type==='sale'?+it.sell:+it.buy,disc:0});
  $('#srch').value='';drawChips();drawLines();drawTotals();
  const inputs=document.querySelectorAll('#lines .q');const idx=cur.lines.findIndex(l=>l.itemId===id);inputs[idx]?.focus();inputs[idx]?.select();
}
function drawLines(){
  $('#lines').innerHTML=`<tr><th>الكود</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>خصم/وحدة</th><th>المجموع</th><th></th></tr>`+

   <td><input class="q" type="number" step="any" value="${l.qty}" oninput="setL(${k},'qty',this.value)"></td>
   <td><input type="number" step="any" value="${l.price}" oninput="setL(${k},'price',this.value)"></td>
   <td><input type="number" step="any" value="${l.disc||0}" oninput="setL(${k},'disc',this.value)"></td>
   <td id="lt${k}"><b>${fm(l.qty*(l.price-(+l.disc||0)))}</b></td>
   <td><button class="btn r s" onclick="cur.lines.splice(${k},1);drawLines();drawTotals()">✕</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">اختار الأصناف من فوق</td></tr>');
}
function setL(k,f,v){const l=cur.lines[k];l[f]=+v||0;$('#lt'+k).innerHTML='<b>'+fm(l.qty*(l.price-(+l.disc||0)))+'</b>';drawTotals()}
function drawTotals(){
  const sum=n2(cur.lines.reduce((a,l)=>a+l.qty*l.price,0));
  const ld=n2(cur.lines.reduce((a,l)=>a+l.qty*(+l.disc||0),0));
  const net=n2(sum-ld-(+cur.discount||0));
  const paid=cur.paid===''?null:+cur.paid;
  const rem=n2(net-(paid??0));
  const cnt=cur.lines.length,qty=n2(cur.lines.reduce((a,l)=>a+(+l.qty),0));
  const p=party(cur.partyId);const prev=p?n2(partyBalance(p)-(cur.id?invTotal(db.invoices.find(x=>x.id===cur.id))-(+db.invoices.find(x=>x.id===cur.id).paid||0):0)):0;
  $('#totals').innerHTML=`<div class="tot">

   <div><small class="muted">خصم الأصناف</small><b>${fm(ld)}</b></div>

   <div><label>المدفوع نقداً</label><input type="number" step="any" id="fPaid" value="${cur.paid}" placeholder="${p?'0':fm(net)}" onchange="cur.paid=this.value===''?'':+this.value;drawTotals()"></div>
   <div><small class="muted">الباقي ${p?'(يتسجل على '+esc(p.name)+')':''}</small><b class="${(paid??(p?0:net))<net?'neg':''}">${fm(paid===null?(p?net:0):rem)}</b></div>
  </div>
  <p class="muted" style="margin-top:6px">عدد الأصناف: ${cnt} — إجمالي الكميات: ${fm(qty)}${p?` — رصيد ${esc(p.name)} قبل الفاتورة: <b>${fm(prev)}</b>`:''}</p>
  <div class="words">${tafqeet(net)}</div>`;
}
function quickParty(type){partyModal(null,type,id=>{cur.partyId=id;drawInv()})}
function saveInv(print,wa){
  if(!cur.lines.length){toast('ضيف صنف واحد على الأقل');return}
  if(cur.lines.some(l=>!(+l.qty>0))){toast('في صنف كميته غلط');return}
  const net=n2(cur.lines.reduce((a,l)=>a+l.qty*(l.price-(+l.disc||0)),0)-(+cur.discount||0));
  if(cur.paid===''){cur.paid=cur.partyId?0:net}
  cur.paid=+cur.paid||0;
  if(!cur.partyId&&n2(cur.paid)<net){toast('الفاتورة النقدي لازم تتدفع كاملة — اختار عميل عشان تسجل الباقي عليه');cur.paid='';drawTotals();return}
  if(cur.type==='sale')for(const l of cur.lines){const it=item(l.itemId);if(it&&!it.service){const avail=stockOf(it)+(cur.id?(db.invoices.find(x=>x.id===cur.id).lines.filter(x=>x.itemId===l.itemId).reduce((a,x)=>a+(+x.qty),0)):0);if(l.qty>avail&&!confirm(`الكمية المتاحة من ${it.name} = ${fm(avail)} بس. تكمل؟`))return}}
  if(cur.id){const k=db.invoices.findIndex(x=>x.id===cur.id);db.invoices[k]=cur;log(`تعديل فاتورة ${cur.type==='sale'?'بيع':'شراء'} رقم ${cur.no}`)}

  save();toast('✅ اتحفظت');

  if(wa)sendInvWA(saved);
  location.hash='edit/'+saved.id;if(location.hash==='#edit/'+saved.id)route();
}

/* ===================== PDF + واتساب ===================== */
async function makePDF(html,name){
  const box=$('#pdfbox');box.innerHTML='<div dir="rtl" style="direction:rtl;width:100%;text-align:right">'+html+'</div>';
  const wrap=$('#pdfwrap');wrap.style.left='0';wrap.style.zIndex='89';
  await new Promise(r=>setTimeout(r,60));
  let cv;try{cv=await htmlToImage.toCanvas(box,{pixelRatio:2,backgroundColor:'#fff',width:794,height:box.offsetHeight})}
  finally{wrap.style.left='-20000px';wrap.style.zIndex=''}
  const {jsPDF}=window.jspdf;const wmm=210,hmm=Math.max(148,wmm*cv.height/cv.width);
  const pdf=new jsPDF({unit:'mm',format:[wmm,hmm],orientation:hmm>=wmm?'portrait':'landscape'});
  pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,wmm,wmm*cv.height/cv.width);
  box.innerHTML='';
  const blob=pdf.output('blob');
  return new File([blob],name+'.pdf',{type:'application/pdf'});
}
function dl(file){
  if(window.Android&&Android.saveFile){const fr=new FileReader();fr.onload=()=>Android.saveFile(fr.result.split(',')[1],file.name,file.type||'application/octet-stream');fr.readAsDataURL(file);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}
if(window.Android&&Android.print){window.print=()=>Android.print(document.title)}
async function sharePDF(html,name,phone,text){
  $('#busy').style.display='flex';
  try{
    const file=await makePDF(html,name);
    // جوه الـ APK: لو فيه جسر أندرويد
    if(window.Android&&Android.sharePdf){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file)});Android.sharePdf(b64,file.name,(phone||'').replace(/\D/g,''),text);return}
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name,text})}catch(e){if(e.name!=='AbortError')throw e}
      return;
    }
    dl(file);
    toast('📄 اتنزل الـ PDF — اسحبه في محادثة واتساب');
    setTimeout(()=>window.open(waLink(phone,text),'_blank'),900);
  }catch(e){console.error(e);toast('حصلت مشكلة في عمل الـ PDF')}
  finally{$('#busy').style.display='none'}
}
function sendInvWA(inv){
  const s=db.settings,p=party(inv.partyId);
  const t=`${s.name}\nفاتورة رقم ${inv.no} بتاريخ ${inv.date}\nالإجمالي: ${fm(invTotal(inv))} ج${p?'\nرصيدك الحالي: '+fm(partyBalance(p))+' ج':''}`;
  sharePDF(invHTML(inv),'فاتورة-'+inv.no+'-'+(p?.name||'نقدي'),p?.phone,t);
}
function downloadInvPDF(inv){$('#busy').style.display='flex';makePDF(invHTML(inv),'فاتورة-'+inv.no).then(dl).finally(()=>$('#busy').style.display='none')}

/* ===================== الخزينة ===================== */
function cash(){
  const kinds={expense:'مصروف',deposit:'إيداع / إضافة',withdraw:'سحب'};
  const mv=[];
  db.invoices.forEach(i=>{if(+i.paid)mv.push({d:i.date,t:`${i.type==='sale'?'بيع':'شراء'} فاتورة ${i.no} - ${party(i.partyId)?.name||'نقدي'}`,in:i.type==='sale'?+i.paid:0,out:i.type==='purchase'?+i.paid:0})});
  db.cash.forEach(c=>mv.push({d:c.date,t:(c.partyId?(c.kind==='collect'?'تحصيل من ':'سداد إلى ')+(party(c.partyId)?.name||''):kinds[c.kind]||'')+(c.note?' - '+c.note:''),in:c.dir==='in'?+c.amount:0,out:c.dir==='out'?+c.amount:0,id:c.id}));
  mv.sort((a,b)=>b.d.localeCompare(a.d));
  $('#app').innerHTML=`<div class="stats"><div class="stat b"><small>رصيد الخزينة</small><b>${fm(cashBalance())} ج</b></div></div>
  <div class="card"><h2>حركة جديدة</h2><div class="row">
   <div><label>النوع</label><select id="kk">${Object.entries(kinds).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
   <div><label>المبلغ</label><input type="number" step="any" id="ka"></div><div><label>التاريخ</label><input type="date" id="kd" value="${today()}"></div>
   <div><label>البيان</label><input id="kn" placeholder="كهربا، صيانة، أجور..."></div><div style="flex:0"><button class="btn" onclick="saveK()">حفظ</button></div></div></div>
  <div class="card"><h2>الحركات</h2><div class="tbl"><table><tr><th>التاريخ</th><th>البيان</th><th>وارد</th><th>منصرف</th></tr>
  ${mv.slice(0,300).map(m=>`<tr ${m.id?`class="click" onclick="delCash('${m.id}')"`:''}><td>${m.d}</td><td>${esc(m.t)}</td><td class="pos">${m.in?fm(m.in):''}</td><td class="neg">${m.out?fm(m.out):''}</td></tr>`).join('')}</table></div></div>`;
  window.saveK=()=>{const a=+$('#ka').value;if(!(a>0)){toast('اكتب المبلغ');return}const k=$('#kk').value;
   db.cash.push({id:uid(),date:$('#kd').value||today(),dir:k==='deposit'?'in':'out',amount:a,note:$('#kn').value,kind:k});log(`${kinds[k]} ${fm(a)} ${$('#kn').value}`);save();route();toast('✅')};
}

/* ===================== التقارير ===================== */
function reports(){
  const d=new Date();const first=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  $('#app').innerHTML=`<div class="card"><h2>📊 التقارير</h2><div class="row"><div><label>من</label><input type="date" id="r1" value="${first}" onchange="dr()"></div><div><label>إلى</label><input type="date" id="r2" value="${today()}" onchange="dr()"></div><div style="flex:0"><button class="btn bl" onclick="window.print()">🖨️</button></div></div></div><div id="rr"></div>`;
  window.dr=()=>{const a=$('#r1').value,b=$('#r2').value;const inR=x=>(!a||x>=a)&&(!b||x<=b);
   const sales=db.invoices.filter(i=>i.type==='sale'&&inR(i.date)),pur=db.invoices.filter(i=>i.type==='purchase'&&inR(i.date));
   const st=sales.reduce((s,i)=>s+invTotal(i),0),pt=pur.reduce((s,i)=>s+invTotal(i),0),pr=sales.reduce((s,i)=>s+invProfit(i),0);
   const exp=db.cash.filter(c=>c.kind==='expense'&&inR(c.date)).reduce((s,c)=>s+(+c.amount),0);
   const col=db.cash.filter(c=>c.kind==='collect'&&inR(c.date)).reduce((s,c)=>s+(+c.amount),0);
   const byItem={};sales.forEach(i=>i.lines.forEach(l=>{const k=l.itemId;byItem[k]=byItem[k]||{n:l.name,u:l.unit,q:0,v:0};byItem[k].q+=+l.qty;byItem[k].v+=l.qty*(l.price-(+l.disc||0))}));
   const byDay={};sales.forEach(i=>{byDay[i.date]=(byDay[i.date]||0)+invTotal(i)});
   $('#rr').innerHTML=`<div class="stats">
    <div class="stat"><small>المبيعات</small><b>${fm(st)}</b><small>${sales.length} فاتورة</small></div>
    <div class="stat w"><small>المشتريات</small><b>${fm(pt)}</b><small>${pur.length} فاتورة</small></div>
    <div class="stat"><small>مجمل الربح</small><b>${fm(pr)}</b></div>
    <div class="stat r"><small>المصروفات</small><b>${fm(exp)}</b></div>
    <div class="stat b"><small>صافي الربح</small><b>${fm(pr-exp)}</b></div>
    <div class="stat"><small>تحصيلات من العملاء</small><b>${fm(col)}</b></div></div>
   <div class="card"><h2>مبيعات الأصناف</h2><div class="tbl"><table><tr><th>الصنف</th><th>الكمية</th><th>القيمة</th></tr>${Object.values(byItem).sort((x,y)=>y.v-x.v).map(r=>`<tr><td>${esc(r.n)}</td><td>${fm(r.q)} ${esc(r.u||'')}</td><td>${fm(r.v)}</td></tr>`).join('')}</table></div></div>
   <div class="card"><h2>مبيعات كل يوم</h2><div class="tbl"><table><tr><th>اليوم</th><th>المبيعات</th></tr>${Object.entries(byDay).sort((x,y)=>y[0].localeCompare(x[0])).map(([k,v])=>`<tr><td>${k}</td><td>${fm(v)}</td></tr>`).join('')}</table></div></div>
   <p class="muted">الربح محسوب على سعر الشراء الحالي لكل صنف.</p>`;
   $('#print').innerHTML=`<div class="ph"><h2>${esc(db.settings.name)}</h2><div>تقرير من ${a} إلى ${b}</div></div>`+$('#rr').innerHTML;
  };dr();
}

function sst(){try{return JSON.parse(localStorage.getItem(SK))||{rev:0,base:{},init:false}}catch(e){return {rev:0,base:{},init:false}}}

  const i=x.k.indexOf('|'),col=x.k.slice(0,i),id=x.k.slice(i+1);
  if(col==='meta'){if(x.del)return;
    if(id==='settings'){const mine=db.settings.ab||{};const v=x.v;v.ab=Object.assign({},v.ab||{});PRIV.forEach(k=>{if(mine[k]!==undefined)v.ab[k]=mine[k]});db.settings=v}
    else if(id==='seq')db.seq=Object.assign({sale:0,purchase:0},x.v);return}
  if(!COLS.includes(col))return;const arr=db[col];const k=arr.findIndex(r=>r.id===id);

      if(r.rev>0){
        const hasLocal=db.invoices.length||db.parties.length||db.cash.length;
        const replace=!hasLocal||confirm('فيه بيانات للمصنع متزامنة من جهاز تاني.\n\n• "موافق" = الجهاز ده ياخد بيانات المصنع (والفواتير اللي على الجهاز ده هتتمسح)\n• "إلغاء" = يدمج بيانات الجهاز ده مع بيانات المصنع');
        applying=true;
        if(replace){const mine=db.settings.ab;db.items=[];db.parties=[];db.invoices=[];db.cash=[];db.log=[];r.recs.forEach(applyRec);if(mine)Object.assign(db.settings.ab=db.settings.ab||{},{token:mine.token,email:mine.email,pendingCode:false});
          afterApply();st.base={};for(const [k,v] of Object.entries(snapMap()))st.base[k]=hsh(v);}
        else{r.recs.forEach(applyRec);afterApply();st.base={};}
        applying=false;
      }else st.base={};
      st.rev=r.rev;st.init=true;sstSave(st);
      try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
      recsAll=r.recs;
    }
    const now=Date.now(),m=snapMap(),changes=[];
    for(const [k,v] of Object.entries(m))if(st.base[k]!==hsh(v))changes.push({k,v:JSON.parse(v),u:now});
    for(const k of Object.keys(st.base))if(!(k in m))changes.push({k,del:1,u:now});
    // الدفعات الكبيرة تتقسم
    let rev=st.rev;const recs=[];
    for(let i=0;i<Math.max(1,changes.length);i+=300){
      const part=changes.slice(i,i+300);
      const r=await gsCall({action:'sync',email:a.email,token:a.token,since:rev,changes:part});if(!r.ok)throw new Error(r.err);
      part.forEach(c=>{if(c.del)delete st.base[c.k];else st.base[c.k]=hsh(JSON.stringify(c.v))});
      recs.push(...r.recs);rev=r.rev;
    }
    if(recs.length){applying=true;recs.forEach(x=>{applyRec(x);if(x.del)delete st.base[x.k];else st.base[x.k]=hsh(x.k.startsWith('meta|settings')?JSON.stringify(pubSettings(x.v)):JSON.stringify(x.v))});afterApply();
      try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}applying=false}
    st.rev=rev;sstSave(st);a.lastSync=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
    syncSt('☁️ '+new Date().toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}),'آخر مزامنة');
    if((recs.length||recsAll.length)&&!busyUI())route();
    if(manual)toast('✅ اتزامن'+(recs.length?` — وصل ${recs.length} تعديل`:''));
  }catch(e){applying=false;syncSt('⚠️','المزامنة فشلت: '+(e.message||e));if(manual)toast('⚠️ المزامنة فشلت: '+(e.message||'مفيش نت'))}
  finally{syncing=false;if(syncAgain){syncAgain=false;setTimeout(()=>syncNow(),500)}}
}
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},45000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
window.addEventListener('online',()=>syncNow());

function backup(){dl(new File([JSON.stringify(db)],'amana-backup-'+today()+'.json',{type:'application/json'}));log('تنزيل نسخة احتياطية');save()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items||!d.invoices)throw 0;if(!confirm('البيانات الحالية هتتبدل بالنسخة دي. متأكد؟'))return;db=d;log('استرجاع نسخة احتياطية');save();route();toast('✅ اترجعت')}catch(e){toast('الملف ده مش نسخة صحيحة')}};r.readAsText(f)}
function resetAll(){if(prompt('⚠️ كل البيانات هتتمسح'+(ab().token?' من كل الأجهزة المتزامنة':'')+'.\nاكتب كلمة "مسح" للتأكيد')!=='مسح')return;db=defaultDB();save();route();toast('اتمسح كل شيء')}
function logPage(){$('#app').innerHTML=`<div class="card"><h2>📝 سجل التعديلات</h2><div class="tbl"><table><tr><th>الوقت</th><th>العملية</th></tr>${db.log.map(l=>`<tr><td>${new Date(l.d).toLocaleString('ar-EG')}</td><td>${esc(l.m)}</td></tr>`).join('')}</table></div></div>`}

}
